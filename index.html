<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow Smiley Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="poster" role="img" aria-label="72 smiling faces in six columns and twelve rows. Colors move diagonally from red and orange through yellow, green, blue, purple, and pink.">
    <!-- Every face uses the same shape. Only the color class changes. -->

    <!-- Row 1 -->
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face orange" aria-hidden="true"><span class="smile"></span></div>
    <div class="face gold" aria-hidden="true"><span class="smile"></span></div>
    <div class="face gold" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 2 -->
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face orange" aria-hidden="true"><span class="smile"></span></div>
    <div class="face gold" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 3 -->
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face orange" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 4 -->
    <div class="face red" aria-hidden="true"><span class="smile"></span></div>
    <div class="face orange" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 5 -->
    <div class="face orange" aria-hidden="true"><span class="smile"></span></div>
    <div class="face gold" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 6 -->
    <div class="face gold" aria-hidden="true"><span class="smile"></span></div>
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 7 -->
    <div class="face yellow" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 8 -->
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face green" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 9 -->
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 10 -->
    <div class="face lime" aria-hidden="true"><span class="smile"></span></div>
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 11 -->
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face cyan" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>

    <!-- Row 12 -->
    <div class="face blue" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>
    <div class="face purple" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>
    <div class="face pink" aria-hidden="true"><span class="smile"></span></div>
  </main>
</body>
</html>
